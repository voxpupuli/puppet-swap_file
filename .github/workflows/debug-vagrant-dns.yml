---
# Temporary diagnostics for acceptance failures on Ubuntu 22.04 guests.
# Reproduces the libvirt + dnsmasq setup used by voxpupuli/gha-puppet and
# inspects guest DNS / DNSSEC state.
# Delete this file once the root cause is fixed upstream.

name: Debug vagrant guest DNS

# yamllint disable-line rule:truthy
on:
  workflow_dispatch: {}
  push:
    branches:
      - debug-dns

permissions:
  contents: read

jobs:
  dns:
    name: ubuntu2204 box ${{ matrix.box }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        box:
          - '4.3.12'
          - '4.3.6'
    env:
      LIBVIRT_DEFAULT_URI: qemu:///system
      VAGRANT_DEFAULT_PROVIDER: libvirt
      VAGRANT_NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v7

      - name: Setup libvirt for Vagrant
        run: |
          sudo add-apt-repository -y ppa:evgeni/vagrant
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            vagrant vagrant-libvirt libvirt-daemon-system libvirt-daemon \
            qemu-system-x86 qemu-utils dnsmasq
          sudo chmod 666 /var/run/libvirt/libvirt-sock

      - name: Boot guest
        run: |
          mkdir -p "/tmp/vagrant-dns-${{ matrix.box }}"
          cd "/tmp/vagrant-dns-${{ matrix.box }}"
          vagrant init generic/ubuntu2204 --box-version "${{ matrix.box }}"
          time vagrant up --provider=libvirt --no-tty

      - name: Inspect DNSSEC trust anchor
        run: |
          cd "/tmp/vagrant-dns-${{ matrix.box }}"
          vagrant ssh -c '
            set -x;
            date -u;
            ls -l /usr/share/dns/root.key /etc/trusted-key.key 2>&1;
            wc -c /usr/share/dns/root.key 2>&1;
            dpkg -l dns-root-data systemd 2>&1 | tail -6;
            grep -R "TrustAnchorFile\|^DNSSEC" /etc/systemd/resolved.conf /usr/lib/systemd/resolved.conf 2>&1;
            resolvectl query example.com || true;
            resolvectl query apt.voxpupuli.org || true;
            getent hosts example.com || echo GETENT_FAIL_EXAMPLE' 2>&1 | tail -40

      - name: Disable DNSSEC and retest
        run: |
          cd "/tmp/vagrant-dns-${{ matrix.box }}"
          vagrant ssh -c '
            set -x;
            sudo resolvectl dnssec eth0 no;
            sudo resolvectl flush-caches;
            resolvectl status | head -25;
            getent hosts example.com || echo GETENT_FAIL_LINK_NO_DNSSEC;
            echo "=== global DNSSEC=no ===";
            sudo sed -i "s/^#*DNSSEC=.*/DNSSEC=no/" /etc/systemd/resolved.conf;
            grep DNSSEC /etc/systemd/resolved.conf;
            sudo systemctl restart systemd-resolved;
            sleep 3;
            resolvectl status | head -20;
            getent hosts example.com && echo GETENT_OK_DNSSEC_NO || echo GETENT_FAIL_DNSSEC_NO;
            timeout 15 wget -q -O /dev/null https://apt.voxpupuli.org/ && echo WGET_OK_DNSSEC_NO || echo WGET_FAIL_DNSSEC_NO' 2>&1 | tail -50

      - name: Destroy guest
        if: always()
        run: |
          cd "/tmp/vagrant-dns-${{ matrix.box }}"
          vagrant destroy -f || true
