---
# Temporary diagnostics for acceptance failures on Ubuntu 22.04 guests.
# Reproduces the libvirt + dnsmasq setup used by voxpupuli/gha-puppet and
# inspects guest DNS. Matrix compares box versions to spot regressions.
# Delete this file once the root cause is fixed upstream.

name: Debug vagrant guest DNS

# yamllint disable-line rule:truthy
on:
  workflow_dispatch: {}
  push:
    branches:
      - debug-dns

permissions:
  contents: read

jobs:
  dns:
    name: ubuntu2204 box ${{ matrix.box }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        box:
          - '4.3.12'
          - '4.3.11'
    env:
      LIBVIRT_DEFAULT_URI: qemu:///system
      VAGRANT_DEFAULT_PROVIDER: libvirt
      VAGRANT_NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v7

      - name: Setup libvirt for Vagrant
        run: |
          sudo add-apt-repository -y ppa:evgeni/vagrant
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            vagrant vagrant-libvirt libvirt-daemon-system libvirt-daemon \
            qemu-system-x86 qemu-utils dnsmasq
          sudo chmod 666 /var/run/libvirt/libvirt-sock

      - name: Dump runner state
        run: |
          echo "::group::dnsmasq packages"
          apt-cache policy dnsmasq dnsmasq-base || true
          echo "::endgroup::"
          echo "::group::libvirt default network"
          sudo virsh net-dumpxml default || true
          echo "::endgroup::"
          echo "::group::libvirt dnsmasq upstream"
          sudo journalctl -u libvirtd --no-pager --since '-5 min' | grep -i -E 'dnsmasq|nameserver' || true
          echo "::endgroup::"

      - name: Boot guest
        run: |
          mkdir -p "/tmp/vagrant-dns-${{ matrix.box }}"
          cd "/tmp/vagrant-dns-${{ matrix.box }}"
          vagrant init generic/ubuntu2204 --box-version "${{ matrix.box }}"
          vagrant box list
          time vagrant up --provider=libvirt --no-tty

      - name: Dump guest DNS configuration
        run: |
          cd "/tmp/vagrant-dns-${{ matrix.box }}"
          vagrant ssh -c 'set -x;
            ls -l /etc/resolv.conf;
            cat /etc/resolv.conf;
            sudo ls /etc/netplan;
            sudo cat /etc/netplan/*.yaml || true;
            resolvectl status;
            resolvectl dns;
            getent hosts apt.voxpupuli.org || echo GETENT_FAIL' 2>&1 | tail -80

      - name: Probe each resolver from the guest
        run: |
          cd "/tmp/vagrant-dns-${{ matrix.box }}"
          vagrant ssh -c 'set -x;
            for s in 4.2.2.1 4.2.2.2 208.67.220.220 192.168.121.1 1.1.1.1 9.9.9.9; do
              sudo sh -c "printf \"nameserver $s\n\" > /etc/resolv.conf";
              printf "%s => " "$s";
              timeout 5 getent hosts apt.voxpupuli.org >/dev/null 2>&1 && echo OK || echo FAIL;
            done;
            sudo rm -f /etc/resolv.conf;
            sudo ln -s /run/systemd/resolve/stub-resolv.conf /etc/resolv.conf' 2>&1 | tail -40

      - name: Test resolvectl DNS override
        run: |
          cd "/tmp/vagrant-dns-${{ matrix.box }}"
          vagrant ssh -c '
            sudo resolvectl dns eth0 1.1.1.1 9.9.9.9;
            sudo resolvectl flush-caches;
            resolvectl dns;
            getent hosts apt.voxpupuli.org || echo GETENT_FAIL;
            timeout 15 wget -q -O /dev/null https://apt.voxpupuli.org/ && echo WGET_OK || echo WGET_FAIL' 2>&1 | tail -20

      - name: Destroy guest
        if: always()
        run: |
          cd "/tmp/vagrant-dns-${{ matrix.box }}"
          vagrant destroy -f || true
